included:
  - Lingleaf
  - LingleafCore/Sources
  - LingleafCore/Tests
  - LingleafUITests
disabled_rules:
  - identifier_name   # short names like `w`, `c` are clear in small scopes
  - force_try         # only used for constant regex literals
  - trailing_comma
line_length:
  warning: 140
  error: 200
cyclomatic_complexity:
  warning: 15
  error: 25
function_body_length:
  warning: 80
  error: 150
type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 500
  error: 800
